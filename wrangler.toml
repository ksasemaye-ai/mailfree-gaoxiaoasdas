name = "mailfree-gaoxiaoasdas"
# name = "mail-exhibit"
main = "src/server.js"
compatibility_date = "2024-01-01"
keep_vars=true

# D1 数据库绑定
[[d1_databases]]
binding = "TEMP_MAIL_DB"
database_name = "mail_free_db" #你的d1数据库名称
database_id = "1695ec96-65c1-499a-9b32-3b99e7727642" # 你的database_id
# 登录会话过期时间（单位：天，默认7天）
# 环境变量
[vars]
# FORWARD_RULES="[{"prefix":"vip","email":"a@example.com"},{"prefix":"*","email":"example@qq.com"}]"
ADMIN_NAME="admin"
ADMIN_PASSWORD="Adm!q-PrADJ4IhMewgVjoCaOKTiJ"
GUEST_PASSWORD="Guest!5-AmQn3oeTyC5S5-vMXwcpc_"
JWT_TOKEN="Z_i9K6J1Ztn0126UwMyfZSqctCCV73aJUXrxPzctkm0"
JWT_TOKENGUEST_PASSWORD="Z_i9K6J1Ztn0126UwMyf"
SESSION_EXPIRE_DAYS="365"
MAIL_DOMAIN="gaoxiaoasdas.com"
RESEND_API_KEY="disabled"
SENDFLARE_API_KEY="disabled"
CYBERPERSONS_API_KEY="disabled"


# 静态资源目录（Workers + Assets）
[assets]
directory = "public"
# 显式指定绑定名，确保在 Worker 中通过 env.ASSETS 可用
binding = "ASSETS"


# R2 存储桶绑定（用于保存完整 EML 内容）
[[r2_buckets]]
binding = "MAIL_EML"
bucket_name = "mail-eml"

